[package]
name = "DocChisel"
version = "0.1.0"
description = "DocChisel Desktop"
authors = ["Ankush Sarkar"]
edition = "2024"

[lib]
name = "docchisel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
dirs = "7.0"
core_engine = { path = "../../../crates/core_engine" }
