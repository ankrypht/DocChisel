name: Build Linux Packages (.deb & AppImage)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target Architecture to Build'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'x64'
          - 'arm64'
          - 'x86'
          - 'armhf'
      create_draft_release:
        description: 'Create draft GitHub Release with collected assets'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  init:
    name: Initialize Build Context
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Extract Project Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Build version: ${VERSION}"
          echo "Release tag: ${TAG_NAME}"

      - name: Determine Target Matrix
        id: matrix
        env:
          SELECTED_ARCH: ${{ github.event.inputs.architecture }}
        run: |
          node -e '
            const selected = process.env.SELECTED_ARCH || "all";
            const allTargets = [
              { arch: "x64", name: "Linux x86_64 (64-bit AMD/Intel)", runner: "ubuntu-22.04", target: "x86_64-unknown-linux-gnu", build_arg: "--x64" },
              { arch: "arm64", name: "Linux ARM64 (64-bit ARM)", runner: "ubuntu-24.04-arm", target: "aarch64-unknown-linux-gnu", build_arg: "--arm64" },
              { arch: "x86", name: "Linux i686 (32-bit AMD/Intel)", runner: "ubuntu-22.04", target: "i686-unknown-linux-gnu", build_arg: "--x86" },
              { arch: "armhf", name: "Linux ARMv7 (32-bit ARM)", runner: "ubuntu-22.04", target: "armv7-unknown-linux-gnueabihf", build_arg: "--armhf" }
            ];
            const filtered = (selected === "all" || !selected) ? allTargets : allTargets.filter(t => t.arch === selected);
            const matrix = { include: filtered };
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
            console.log("Generated matrix:", JSON.stringify(matrix, null, 2));
          '

  build-linux:
    name: Build ${{ matrix.name }}
    needs: init
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.init.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
      LDAI_VERBOSE: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: linux-${{ matrix.arch }}
          workspaces: |
            crates/core_engine
            apps/desktop/src-tauri

      # Setup for x86_64 (Native host on ubuntu-22.04)
      - name: Install Dependencies for x86_64
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            file \
            libfuse2

      # Setup for ARM64 (Native host on ubuntu-24.04-arm)
      - name: Install Dependencies for ARM64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            file \
            libfuse2

      # Setup for 32-bit AMD/Intel (i686 on ubuntu-22.04)
      - name: Install Dependencies for i686 (32-bit x86)
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            libwebkit2gtk-4.1-dev:i386 \
            libgtk-3-dev:i386 \
            libgtk-3-bin \
            libglib2.0-bin \
            librsvg2-dev:i386 \
            librsvg2-common:i386 \
            libssl-dev:i386 \
            patchelf \
            file \
            libfuse2 \
            libfuse2:i386

      # Setup for 32-bit ARM (armhf on ubuntu-22.04)
      - name: Install Dependencies for ARMv7 (32-bit ARM)
        if: matrix.arch == 'armhf'
        run: |
          sudo dpkg --add-architecture armhf

          # Restrict all existing repositories to amd64 so apt does not 404 for armhf
          # (Azure/Ubuntu runners use mirror+file:/etc/apt/apt-mirrors.txt)
          sudo python3 -c '
          import glob, re
          for path in ["/etc/apt/sources.list"] + glob.glob("/etc/apt/sources.list.d/*.list"):
              try:
                  with open(path, "r") as f:
                      lines = f.readlines()
                  new_lines = []
                  for line in lines:
                      l = line.strip()
                      if l.startswith("deb ") or l.startswith("deb-src "):
                          if not re.search(r"\[[^\]]*arch=", line):
                              if re.search(r"^\s*(?:deb|deb-src)\s+\[", line):
                                  line = re.sub(r"^(\s*(?:deb|deb-src)\s+\[)", r"\1arch=amd64 ", line)
                              else:
                                  line = re.sub(r"^(\s*(?:deb|deb-src)\s+)", r"\1[arch=amd64] ", line)
                      new_lines.append(line)
                  with open(path, "w") as f:
                      f.writelines(new_lines)
              except Exception:
                  pass
          for path in glob.glob("/etc/apt/sources.list.d/*.sources"):
              try:
                  with open(path, "r") as f:
                      content = f.read()
                  if "Architectures:" not in content:
                      with open(path, "a") as f:
                          f.write("\nArchitectures: amd64\n")
              except Exception:
                  pass
          '

          cat <<EOF | sudo tee /etc/apt/sources.list.d/ports-armhf.list
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF

          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libwebkit2gtk-4.1-dev:armhf \
            libgtk-3-dev:armhf \
            libgtk-3-bin \
            libglib2.0-bin \
            librsvg2-dev:armhf \
            librsvg2-common:armhf \
            libssl-dev:armhf \
            patchelf \
            file \
            libfuse2 \
            qemu-user-static \
            binfmt-support

          sudo update-binfmts --enable qemu-arm 2>/dev/null || true

          # Install native appimagetool and download armhf runtime stub
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          sudo chmod +x /tmp/appimagetool.AppImage
          cd /tmp && sudo /tmp/appimagetool.AppImage --appimage-extract >/dev/null 2>&1
          sudo rm -rf /opt/appimagetool && sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-armhf -O /opt/appimagetool/runtime-armhf 2>/dev/null || true

          # Pre-configure linuxdeploy-plugin-appimage shim in Tauri cache
          # This runs native appimagetool and eliminates QEMU user-mode FUSE exit code 2 crashes
          mkdir -p "$HOME/.cache/tauri"
          cat <<'SHIM_EOF' > "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
          #!/bin/bash
          set -e

          for arg in "$@"; do
              if [ "$arg" = "--plugin-api-version" ]; then
                  echo "0"
                  exit 0
              fi
              if [ "$arg" = "--plugin-type" ]; then
                  echo "output"
                  exit 0
              fi
          done

          APPDIR=""
          while [ "$#" -gt 0 ]; do
              case "$1" in
                  --appdir)
                      APPDIR="$2"
                      shift 2
                      ;;
                  *)
                      shift
                      ;;
              esac
          done

          if [ -n "$APPDIR" ]; then
              echo "==> [DocChisel Shim] Packaging ARMv7 AppImage using native appimagetool..."
              export ARCH="${ARCH:-armhf}"
              export APPIMAGE_EXTRACT_AND_RUN=1

              OUT="${OUTPUT:-${APPDIR%/*}/DocChisel_0.1.0_armhf.AppImage}"
              echo "    AppDir: $APPDIR"
              echo "    Output: $OUT"

              TOOL="/usr/local/bin/appimagetool"
              if [ ! -x "$TOOL" ]; then
                  TOOL="/opt/appimagetool/AppRun"
              fi

              if [ -f /opt/appimagetool/runtime-armhf ]; then
                  "$TOOL" --runtime-file /opt/appimagetool/runtime-armhf "$APPDIR" "$OUT"
              else
                  "$TOOL" "$APPDIR" "$OUT"
              fi
              exit $?
          fi

          exit 0
          SHIM_EOF
          chmod +x "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Tauri Desktop Package (.deb + .AppImage)
        run: node scripts/build-desktop.mjs --linux ${{ matrix.build_arg }} --verbose

      - name: Collect Release Artifacts
        run: node scripts/collect-artifacts.mjs

      - name: Upload Architecture Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: docchisel-linux-arch-${{ matrix.arch }}-v${{ needs.init.outputs.version }}
          path: releases/linux/
          if-no-files-found: error

  package-all:
    name: Consolidate All Linux Packages
    needs: [init, build-linux]
    runs-on: ubuntu-24.04
    if: always() && !cancelled() && needs.init.result == 'success'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download all Linux artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: docchisel-linux-arch-*
          merge-multiple: true
          path: releases/linux

      - name: Verify and list collected packages
        run: |
          echo "=================================================="
          echo "📦 Finalized Linux Packages (v${{ needs.init.outputs.version }}):"
          echo "=================================================="
          ls -lh releases/linux/
          echo "--------------------------------------------------"
          echo "SHA-256 Checksums:"
          cd releases/linux && sha256sum * | tee SHA256SUMS.txt
          echo "=================================================="

      - name: Upload Unified Linux Artifact (All Architectures)
        uses: actions/upload-artifact@v6
        with:
          name: docchisel-linux-all-v${{ needs.init.outputs.version }}
          path: releases/
          if-no-files-found: error

      - name: Create Draft GitHub Release
        if: needs.build-linux.result == 'success' && (github.event.inputs.create_draft_release == 'true' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.init.outputs.tag_name }}
          name: "DocChisel v${{ needs.init.outputs.version }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            releases/linux/*
