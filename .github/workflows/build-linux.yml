name: Build Linux Packages (.deb & AppImage)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target Architecture to Build'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'x64'
          - 'arm64'
          - 'x86'
          - 'armhf'
      create_draft_release:
        description: 'Create draft GitHub Release with collected assets'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  init:
    name: Initialize Build Context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Build version: ${VERSION}"
          echo "Release tag: ${TAG_NAME}"

  build-linux:
    name: Build ${{ matrix.name }}
    needs: init
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.architecture == 'all' || github.event.inputs.architecture == matrix.arch
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            name: "Linux x86_64 (64-bit AMD/Intel)"
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build_arg: --x64
          - arch: arm64
            name: "Linux ARM64 (64-bit ARM)"
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_arg: --arm64
          - arch: x86
            name: "Linux i686 (32-bit AMD/Intel)"
            runner: ubuntu-22.04
            target: i686-unknown-linux-gnu
            build_arg: --x86
          - arch: armhf
            name: "Linux ARMv7 (32-bit ARM)"
            runner: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            build_arg: --armhf

    runs-on: ${{ matrix.runner }}

    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: linux-${{ matrix.arch }}
          workspaces: |
            crates/core_engine
            apps/desktop/src-tauri

      # Setup for x86_64 (Native host on ubuntu-22.04)
      - name: Install Dependencies for x86_64
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            libfuse2

      # Setup for ARM64 (Native host on ubuntu-24.04-arm)
      - name: Install Dependencies for ARM64
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            libfuse2

      # Setup for 32-bit AMD/Intel (i686 on ubuntu-22.04)
      - name: Install Dependencies for i686 (32-bit x86)
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            libwebkit2gtk-4.1-dev:i386 \
            libgtk-3-dev:i386 \
            libayatana-appindicator3-dev:i386 \
            librsvg2-dev:i386 \
            libssl-dev:i386 \
            libxdo-dev:i386 \
            patchelf \
            libfuse2:i386

      # Setup for 32-bit ARM (armhf on ubuntu-22.04)
      - name: Install Dependencies for ARMv7 (32-bit ARM)
        if: matrix.arch == 'armhf'
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i -e 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
          echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
          echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/armhf.list
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libwebkit2gtk-4.1-dev:armhf \
            libgtk-3-dev:armhf \
            libayatana-appindicator3-dev:armhf \
            librsvg2-dev:armhf \
            libssl-dev:armhf \
            libxdo-dev:armhf \
            patchelf \
            qemu-user-static \
            binfmt-support

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Tauri Desktop Package (.deb + .AppImage)
        run: node scripts/build-desktop.mjs --linux ${{ matrix.build_arg }}

      - name: Collect Release Artifacts
        run: node scripts/collect-artifacts.mjs

      - name: Upload Architecture Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docchisel-linux-arch-${{ matrix.arch }}-v${{ needs.init.outputs.version }}
          path: releases/linux/
          if-no-files-found: error

  package-all:
    name: Consolidate All Linux Packages
    needs: [init, build-linux]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && needs.init.result == 'success'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docchisel-linux-arch-*
          merge-multiple: true
          path: releases/linux

      - name: Verify and list collected packages
        run: |
          echo "=================================================="
          echo "📦 Finalized Linux Packages (v${{ needs.init.outputs.version }}):"
          echo "=================================================="
          ls -lh releases/linux/
          echo "--------------------------------------------------"
          echo "SHA-256 Checksums:"
          cd releases/linux && sha256sum * | tee SHA256SUMS.txt
          echo "=================================================="

      - name: Upload Unified Linux Artifact (All Architectures)
        uses: actions/upload-artifact@v4
        with:
          name: docchisel-linux-all-v${{ needs.init.outputs.version }}
          path: releases/
          if-no-files-found: error

      - name: Create Draft GitHub Release
        if: needs.build-linux.result == 'success' && (github.event.inputs.create_draft_release == 'true' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init.outputs.tag_name }}
          name: "DocChisel v${{ needs.init.outputs.version }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            releases/linux/*
