[workspace]
resolver = "2"
members = [
    "crates/core_engine",
    "apps/desktop/src-tauri",
]

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false


