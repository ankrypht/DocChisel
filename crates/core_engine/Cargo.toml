[package]
name = "core_engine"
version = "0.1.0"
edition = "2024"
authors = ["Ankush Sarkar"]
description = "Pure Rust offline PDF and image processing engine"
license = "Apache-2.0"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.10"
lopdf = "0.46"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
webp = "0.3.1"
imageproc = { version = "0.27", default-features = false, features = ["text"] }
ab_glyph = "0.2"
rand = "0.10"
uniffi = { version = "0.29", default-features = false, features = ["cli"] }

[dev-dependencies]
tempfile = "3.27.0"

